<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work</title>
  <style>

    @font-face{font-family:'BebasNeue';src: url('fonts/BebasNeue-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:'Mont';src: url('fonts/Mont-ExtraLightDEMO.otf') format('opentype');font-weight:300;font-style:normal;font-display:swap}
    @font-face{font-family:'Mont';src: url('fonts/Mont-HeavyDEMO.otf') format('opentype');font-weight:800;font-style:normal;font-display:swap}
      @font-face{font-family:'LEMONMILK';src: url('fonts/LEMONMILK-Light.otf') format('opentype');font-weight:300;font-style:normal;font-display:swap}
      @font-face{font-family:'LEMONMILK';src: url('fonts/LEMONMILK-Medium.otf') format('opentype');font-weight:500;font-style:normal;font-display:swap}

    :root{
      --max-width:1040px;
      --gap:18px;
      --base-font:16px;
      --heading-size:32px;
      --nav-size:18px;
      --viewer-title-size:22px;
      --thumb-height:130px;
      --picture-gap:6px;
      --accent-color:#f2bf05;
    }

    *{box-sizing:border-box}

    html,body{margin:0;padding:0;min-height:100%;font-family:'Mont','BebasNeue','Inter',Arial,Helvetica,sans-serif;background:#000;color:var(--accent-color);font-weight:400;font-size:var(--base-font);line-height:1.35}

      .name { font-family: 'Mont','BebasNeue','Inter', Arial, Helvetica, sans-serif; font-size: var(--heading-size); font-weight:800; margin:0 0 7px 0; letter-spacing:0.6px }
      .name { font-family: 'LEMONMILK','Mont','BebasNeue','Inter', Arial, Helvetica, sans-serif; font-size: var(--heading-size); font-weight:500; margin:0 0 7px 0; letter-spacing:0.3px }
      .top-area .title { font-family:'LEMONMILK','Mont','BebasNeue','Inter',Arial,Helvetica,sans-serif; font-size: var(--nav-size); font-weight:300; margin:0; letter-spacing:0.2px; text-decoration:none }
    .identity {
      line-height: 1.1;
    }

    .identity-link {
      color: inherit;
      text-decoration: none;
    }

    /* header fonts handled above */

    .top-area{width:var(--max-width);margin:42px auto 0 auto;display:flex;justify-content:space-between;align-items:center;gap:var(--gap)}

    .nav {
      display: flex;
      gap: 28px;
      font-size: var(--nav-size);
      font-weight: 700;
      padding-top: 6px;
      letter-spacing: 0.2px;
    }

    .nav-item{position:relative}
    .nav-item .nav-link{display:inline-block}
    .nav-item .dropdown{position:absolute;left:0;top:100%;background:#000;border:1px solid #222;display:none;min-width:180px;padding:6px 0;z-index:40}
    .nav-item .dropdown a{display:block;padding:8px 12px;color:inherit;text-decoration:none;white-space:nowrap}
    .nav-item:hover .dropdown{display:block}

    .nav a {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      padding: 2px 5px;
      margin: -2px -5px;
      transition: background-color 0.18s ease;
    }

    .nav a:hover {
      background-color: rgba(255,255,255,0.06);
      text-decoration: none;
    }

    .gallery {
      width: var(--max-width);
      margin: 42px auto 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      column-gap: var(--picture-gap);
      row-gap: var(--gap);
    }

    .picture {
      aspect-ratio: 17 / 9;
      background: #000000;
      overflow: hidden;
    }
    .picture img { width:100%;height:100%;object-fit:cover;display:block }

    .picture-title {
      display: inline-block;
      margin: 5px 0 0 0;
      padding: 1px 4px;
      margin-left: -4px;
      font-size: 14px;
      font-family: 'LEMONMILK','Mont','BebasNeue', Arial, Helvetica, sans-serif;
      font-weight: 300;
      letter-spacing: 0.2px;
      transition: background-color 0.18s ease;
      color: inherit;
      text-decoration: none;
    }

    .project{
      color: inherit;
      text-decoration: none;
      display:block;
    }

    .project:hover .picture-title{ text-decoration: none; }
    .project:hover .picture-title { background-color: rgba(255,255,255,0.04); }

    .site-footer { margin-top:auto;padding:60px 0 28px 0;text-align:center;font-size:14px;font-weight:300;font-family:'LEMONMILK','Mont','BebasNeue',Arial,Helvetica,sans-serif;letter-spacing:0.2px }

    @media (max-width: 1140px) {
      .top-area,
      .gallery {
        width: calc(100% - 48px);
      }
    }

    @media (max-width: 760px) {
      .top-area {
        flex-direction: column;
        gap: 18px;
      }

      .nav {
        flex-wrap: wrap;
        gap: 18px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>
<body>

      </div>
    </a>

    <nav class="nav" aria-label="Main navigation">
      <div class="nav-item">

        <div class="dropdown" aria-hidden="true">
          <a href="narrative.html">Narrative</a>
          <a href="commercial.html">Commercial</a>
        </div>
      </div>
      <a href="reels.html">Reels</a>
      <a href="about.html">About</a>
      <a href="contacts.html">Contacts</a>
    </nav>
  </div>


  <main class="gallery" id="work">
    <a class="project" href="viewer.html?album=cinnabar">
      <div class="picture"><img src="photos/Cinnabar%20for%20a%20Jealous%20God/01_thumbnails/Still%202026-08-15%20195818_1.206.1image.webp" alt="Cinnabar"></div>
      <p class="picture-title">Cinnabar for a Jealous God</p>
    </a>

    <a class="project" href="viewer.html?album=crazy">
      <div class="picture"><img src="photos/Crazy%20Fucking%20Dance%20Lady/01_thumbnails/Still 2026-08-15 194253_1.271.1image.webp" alt="Crazy"></div>
      <p class="picture-title">Crazy Fucking Dance Lady</p>
    </a>

    <a class="project" href="viewer.html?album=reservoir">
      <div class="picture"><img src="photos/Reservoir/01_thumbnails/Still 2026-08-15 200933_1.3.1image.webp" alt="Reservoir"></div>
      <p class="picture-title">Reservoir</p>
    </a>

    <a class="project" href="viewer.html?album=macbeth">
      <div class="picture"><img src="photos/Macbeth/01_thumbnails/Still%202026-08-16%20011549_1.12.4image.webp" alt="Macbeth"></div>

  <footer class="site-footer">
    © 2026 Jiaping Zhao. All rights reserved.
  </footer>

</body>
</html>
