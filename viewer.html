<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reel Viewer</title>
  <style>
    @font-face{font-family:'BebasNeue';src:url('fonts/BebasNeue-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:'Mont';src: url('fonts/Mont-ExtraLightDEMO.otf') format('opentype');font-weight:300;font-style:normal;font-display:swap}
    @font-face{font-family:'Mont';src: url('fonts/Mont-HeavyDEMO.otf') format('opentype');font-weight:800;font-style:normal;font-display:swap}
    @font-face{font-family:'LEMONMILK';src: url('fonts/LEMONMILK-Light.otf') format('opentype');font-weight:300;font-style:normal;font-display:swap}
    @font-face{font-family:'LEMONMILK';src: url('fonts/LEMONMILK-Medium.otf') format('opentype');font-weight:500;font-style:normal;font-display:swap}
    :root{--max-width:980px;--gap:18px;--base-font:16px;--viewer-title-size:22px;--thumb-height:130px;--picture-gap:4px;--accent-color:#f2bf05}
    *{box-sizing:border-box}
    body{font-family:'Mont','BebasNeue','Inter',Arial,Helvetica,sans-serif;margin:0;background:#000;color:var(--accent-color);font-weight:400;font-size:var(--base-font);line-height:1.35}
    .wrap{max-width:var(--max-width);margin:42px auto;display:flex;flex-direction:column;align-items:center;gap:var(--gap)}
    .back{align-self:flex-start;text-decoration:none;color:inherit;font-size:14px}
    .main-figure{width:100%;display:flex;justify-content:center}
    .main-figure img{width:100%;max-height:66vh;object-fit:contain;border:1px solid #222}
    .thumbs{display:grid;grid-template-columns:1fr;gap:var(--picture-gap);width:100%;margin-top:6px}
    .thumbs img{width:100%;height:calc(var(--thumb-height) - 20px);object-fit:cover;cursor:pointer;border:2px solid transparent;display:block}
    .thumbs .active{border-color:var(--accent-color)}
    .title{font-family:'LEMONMILK','Mont','BebasNeue',Arial,Helvetica,sans-serif;font-size:var(--viewer-title-size);margin:0;font-weight:300;color:var(--accent-color)}
    @media(min-width:900px){
      .thumbs{grid-template-columns:repeat(3,1fr);gap:8px}
      .thumbs img{height:var(--thumb-height)}
    }
  </style>
</head>
<body>

    <a class="back" href="index.html">← Back</a>
    <h1 class="title" id="albumTitle">Reel</h1>

    <div class="main-figure">

    <div class="thumbs" id="thumbs"></div>

        ]
      }
    };

    function q(name){
      return new URLSearchParams(location.search).get(name);
    }

    function encodeSegment(s){
      return encodeURIComponent(s).replace(/%20/g, '%20');
    }

    const albumKey = q('album') || 'cinnabar';
    const album = albums[albumKey];
    const titleEl = document.getElementById('albumTitle');
    const mainImage = document.getElementById('mainImage');
    const thumbs = document.getElementById('thumbs');

    if(!album){
      titleEl.textContent = 'Album not found';
    } else {
      titleEl.textContent = album.title;
      // set main image to first
      const first = album.images[0];
      mainImage.src = ['photos', encodeSegment(album.folder), '02_large', encodeSegment(first)].join('/');

      album.images.forEach((fn, i) => {
        const t = document.createElement('img');
        t.src = ['photos', encodeSegment(album.folder), '01_thumbnails', encodeSegment(fn)].join('/');
        t.alt = fn;
        if(i===0) t.classList.add('active');
        t.addEventListener('click', ()=>{
          mainImage.src = ['photos', encodeSegment(album.folder), '02_large', encodeSegment(fn)].join('/');
          document.querySelectorAll('#thumbs img').forEach(x=>x.classList.remove('active'));
          t.classList.add('active');
        });
        thumbs.appendChild(t);
      });
    }
  </script>
</body>
</html>
